<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A4YE Field Ops</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #e5e7eb; font: 16px/1.45 -apple-system, system-ui, Roboto, sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box; }
    h1 { font-size: 20px; margin: 18px 0 8px; color: #fff; }
    p { margin: 0 0 22px; color: #9ca3af; max-width: 320px; }
    button { background: #fa001c; color: #fff; border: 0; border-radius: 8px; padding: 12px 26px; font-size: 16px; font-weight: 600; }
    img { width: 96px; }
  </style>
</head>
<body>
  <main>
    <div>
      <img src="icon.png" alt="">
      <h1>Can't reach Field Ops</h1>
      <p>Check that the phone has signal or Wi-Fi, then try again.</p>
      <button onclick="location.replace('https://ops.all4youelectrical.com/')">Try again</button>
    </div>
  </main>
</body>
</html>
