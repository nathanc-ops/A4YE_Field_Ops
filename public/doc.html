<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Document</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/brand/favicon.png">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: var(--bg); }
    .doc { max-width: 820px; margin: 24px auto; padding: 0 16px 60px; }
    .doc .card { padding: 28px; }
    .head { border-top: 6px solid var(--brand); padding-top: 14px; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; border-bottom: 2px solid var(--border); padding-bottom: 16px; margin-bottom: 16px; }
    .co { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .bolt { background: var(--brand); color: #111; width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; }
    .big { font-size: 26px; font-weight: 800; text-align: right; }
    .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
    .terms { white-space: pre-wrap; font-size: 12px; color: var(--muted); margin-top: 18px; }
    .respond { margin-top: 20px; border-top: 2px solid var(--border); padding-top: 18px; }
    .opt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 8px 0 14px; }
    .opt-card { position: relative; text-align: left; font: inherit; color: inherit; background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 18px 16px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
    .opt-card.rec { border-color: color-mix(in srgb, var(--brand) 45%, var(--border)); }
    .opt-card.sel { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 25%, transparent); }
    .opt-card.dim { opacity: .45; }
    .opt-card[disabled] { cursor: default; }
    .opt-card .ribbon { position: absolute; top: -11px; left: 14px; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
    .opt-card .oname { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 22px; text-transform: uppercase; }
    .opt-card .oprice { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .opt-card .odesc { margin: 6px 0 0; }
    .opt-card ul, .shared ul { margin: 8px 0 4px; padding-left: 18px; }
    .opt-card li { margin: 3px 0; }
    .opt-card .pickmark { margin-top: auto; padding-top: 8px; font-weight: 700; color: var(--brand); }
    .shared { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
    @media print { .opt-card { break-inside: avoid; } }
    @media (max-width: 560px) { .parties { grid-template-columns: 1fr; } .doc .card { padding: 18px; } }
  </style>
</head>
<body>
  <div class="doc" id="doc"><div class="empty">Loading…</div></div>
  <div id="toast"></div>
<script>
'use strict';
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => (Number(n) || 0).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
const fmtDate = s => s ? new Date(s.length === 10 ? s + 'T00:00:00' : s).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : '';
const [, , kind, token] = location.pathname.split('/');

async function load(method = 'GET', body) {
  const url = `/api/public/${kind}/${token}${body ? '/respond' : ''}`;
  // if this browser is signed in to the office app, say so: staff can preview drafts and don't count as the customer viewing
  let tok = null; try { tok = method === 'GET' ? localStorage.getItem('fo_token') : null; } catch { /* private mode */ }
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json', ...(tok ? { Authorization: 'Bearer ' + tok } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'Not found');
  return data;
}

function render(d) {
  const doc = d.doc, isEst = d.kind === 'estimate';
  document.title = `${isEst ? 'Estimate' : 'Invoice'} ${doc.number} — ${d.company.name}`;
  const root = document.documentElement.style, ok = h => /^#[0-9a-f]{6}$/i.test(h || '');
  if (ok(d.company.brand_primary)) root.setProperty('--accent', d.company.brand_primary);
  if (ok(d.company.brand_accent)) root.setProperty('--brand', d.company.brand_accent);
  const loc = d.location;
  const cust = d.customer;
  const canRespond = isEst && ['sent', 'viewed'].includes(doc.status) && !doc.pending_review;
  const opts = isEst ? (doc.options || []) : [];
  const chosen = opts.find(o => o.id === doc.approved_option_id);
  let pick = chosen ? chosen.id : canRespond && opts.length ? (opts.find(o => o.recommended) || opts[0]).id : null;
  const optLines = id => doc.items.filter(i => i.option_id === id);
  const shared = doc.items.filter(i => !i.option_id);
  const lineLi = i => `<li>${esc(i.description)}${Number(i.qty) !== 1 ? ` <span class="muted">× ${Number(i.qty).toLocaleString()}</span>` : ''}</li>`;
  const optionsHtml = !opts.length ? '' : `
    <h3 style="margin-top:6px">${canRespond ? 'Choose your option' : chosen ? 'Your choice' : 'Options'}</h3>
    <div class="opt-grid">${opts.map(o => `<button type="button" class="opt-card ${o.recommended ? 'rec' : ''} ${o.id === pick ? 'sel' : ''} ${chosen && o.id !== chosen.id ? 'dim' : ''}" data-pick="${o.id}" ${canRespond ? '' : 'disabled'}>
        ${o.recommended ? '<div class="ribbon">Recommended</div>' : ''}
        <div class="oname">${esc(o.name)}</div><div class="oprice">${money(o.total)}</div>
        <div class="small muted">${o.tax ? `includes ${money(o.tax)} tax` : 'no tax'}${o.discount ? ` · ${money(o.discount)} discount` : ''}</div>
        ${o.description ? `<p class="odesc">${esc(o.description)}</p>` : ''}
        <ul>${optLines(o.id).map(lineLi).join('')}</ul>
        ${chosen && o.id === chosen.id ? '<div class="pill good">✓ Selected</div>' : canRespond ? `<div class="pickmark">${o.id === pick ? '● Selected' : '○ Select'}</div>` : ''}
      </button>`).join('')}</div>
    ${shared.length ? `<div class="shared"><b>Included with every option:</b><ul>${shared.map(lineLi).join('')}</ul></div>` : ''}`;
  const pickLabel = () => { const o = opts.find(x => x.id === pick); return o ? `Approve “${esc(o.name)}” — ${money(o.total)}` : 'Approve'; };
  const statusMsg = isEst
    ? { approved: `✓ ${chosen ? `“${esc(chosen.name)}” approved` : 'Approved'} by ${esc(doc.signature_name)} — thank you! We'll be in touch to schedule.`, declined: 'This estimate was declined.', expired: 'This estimate has expired — please contact us for an updated price.' }[doc.status]
    : doc.status === 'paid' ? '✓ Paid in full — thank you!' : doc.status === 'void' ? 'This invoice has been voided.' : '';
  const staffNote = !d.staff_preview ? '' : doc.status === 'draft' && !isEst
    ? '<div class="card" style="margin-bottom:12px;border-left:4px solid #d97706"><b>Draft preview: only your staff can see this.</b> The customer\'s link starts working once you send the invoice.</div>'
    : '<div class="card" style="margin-bottom:12px;border-left:4px solid #64748b;font-size:13px">You\'re signed in as staff, so opening this page doesn\'t count as the customer viewing it.</div>';
  document.getElementById('doc').innerHTML = staffNote + `<div class="card">
    <div class="head"><div><div class="co">${d.company.logo_url ? `<img src="${esc(d.company.logo_url)}" alt="${esc(d.company.name)}" style="height:72px;max-width:240px;object-fit:contain">` : `<span class="bolt">⚡</span>${esc(d.company.name)}`}</div>
      <div class="muted small">${[d.company.address, d.company.phone, d.company.email].filter(Boolean).map(esc).join(' · ')}${d.company.license ? `<br>License ${esc(d.company.license)}` : ''}</div></div>
      <div><div class="big">${isEst ? 'ESTIMATE' : 'INVOICE'}</div><div class="num">#${esc(doc.number)}</div>
      <div class="num muted small">${isEst ? (doc.valid_until ? `Valid until ${fmtDate(doc.valid_until)}` : '') : `Issued ${fmtDate(doc.issue_date)}<br>Due ${fmtDate(doc.due_date) || 'on receipt'}`}</div></div></div>
    ${isEst && doc.pending_review && ['sent', 'viewed', 'draft'].includes(doc.status) ? '<div class="alert info" style="margin-bottom:16px">Your technician is confirming this pricing with our office. You can review the options now and approve as soon as it’s confirmed — usually within minutes.</div>' : ''}
    ${statusMsg ? `<div class="alert ${doc.status === 'approved' || doc.status === 'paid' ? 'info' : ''}" style="margin-bottom:16px">${statusMsg}</div>` : ''}
    <div class="parties"><div><h3>${isEst ? 'Prepared for' : 'Bill to'}</h3><b>${esc(cust.company || cust.name)}</b>${cust.company ? `<br>${esc(cust.name)}` : ''}<br>${esc(cust.billing_address || '')}</div>
      ${loc ? `<div><h3>Job site</h3>${esc([loc.address, loc.city, loc.state, loc.zip].filter(Boolean).join(', '))}${d.job ? `<br><span class="muted">Job ${esc(d.job.number)}</span>` : ''}</div>` : ''}</div>
    ${doc.title ? `<h2>${esc(doc.title)}</h2>` : ''}
    ${optionsHtml}
    ${opts.length ? '' : `<div class="table-wrap"><table><thead><tr><th>Description</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Amount</th></tr></thead>
      <tbody>${doc.items.map(it => `<tr><td>${esc(it.description)}</td><td class="num">${Number(it.qty).toLocaleString()}</td><td class="num">${money(it.unit_price)}</td><td class="num">${money(it.qty * it.unit_price)}</td></tr>`).join('')}</tbody></table></div>
    <div class="totals" style="margin-top:14px">
      <div><span>Subtotal</span><span>${money(doc.subtotal)}</span></div>
      ${doc.discount ? `<div><span>Discount</span><span>−${money(doc.discount)}</span></div>` : ''}
      <div><span>Tax (${doc.tax_rate}%)</span><span>${money(doc.tax)}</span></div>
      <div class="grand"><span>Total</span><span>${money(doc.total)}</span></div>
      ${!isEst && doc.paid ? `<div><span>Paid</span><span>−${money(doc.paid)}</span></div><div class="grand"><span>Balance due</span><span>${money(doc.balance)}</span></div>` : ''}
    </div>`}
    ${doc.notes ? `<div style="white-space:pre-wrap;margin-top:18px">${esc(doc.notes)}</div>` : ''}
    ${!isEst && d.job && d.job.signoff_name ? `<div class="alert info" style="margin-top:16px">✍ Work accepted by <b>${esc(d.job.signoff_name)}</b> on ${fmtDate(d.job.signoff_at)}.</div>` : ''}
    ${doc.terms ? `<div class="terms">${esc(doc.terms)}</div>` : ''}
    ${!isEst && doc.balance > 0 && doc.status !== 'void' ? `<div class="respond"><h2>How to pay</h2><p>Call ${esc(d.company.phone || 'our office')} to pay by card, or mail a check payable to <b>${esc(d.company.name)}</b>${d.company.address ? ` at ${esc(d.company.address)}` : ''}. Please reference invoice #${esc(doc.number)}.</p></div>` : ''}
    ${canRespond ? `<div class="respond no-print"><h2>Approve this estimate</h2>
      <p class="muted small">By typing your name and clicking Approve, you authorize ${esc(d.company.name)} to perform the work described${opts.length ? ' in the option you selected' : ' above'} for the total shown, subject to the terms.</p>
      <form id="ap" class="row"><input name="sig" placeholder="Type your full name to sign" required style="max-width:320px"><button class="btn primary" id="apbtn">${pickLabel()}</button><button type="button" class="btn danger" id="decline">Decline</button></form></div>` : ''}
    <div class="row no-print" style="margin-top:20px;justify-content:flex-end"><button class="btn" onclick="print()">Print / Save PDF</button></div>
  </div>`;
  if (canRespond) {
    document.getElementById('ap').onsubmit = async e => { e.preventDefault(); try { render(await load('POST', { decision: 'approve', signature_name: e.target.sig.value, option_id: pick })); } catch (err) { alert(err.message); } };
    document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
      pick = Number(b.dataset.pick);
      document.querySelectorAll('[data-pick]').forEach(x => { const on = Number(x.dataset.pick) === pick; x.classList.toggle('sel', on); const m = x.querySelector('.pickmark'); if (m) m.textContent = on ? '● Selected' : '○ Select'; });
      document.getElementById('apbtn').innerHTML = pickLabel();
    });
    document.getElementById('decline').onclick = async () => { if (confirm('Decline this estimate?')) try { render(await load('POST', { decision: 'decline' })); } catch (err) { alert(err.message); } };
  }
}
load().then(render).catch(e => { document.getElementById('doc').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; });
</script>
</body>
</html>
